name: Agent Stream Operations Staff

on:
  pull_request:
    paths:
      - "packages/agent/examples/stream-operations-staff/**"
      - "packages/agent/src/**"
      - "packages/agent/package.json"
      - "packages/comment-intelligence/src/**"
      - "packages/comment-intelligence/package.json"
      - "packages/voice/src/**"
      - "packages/voice/package.json"
      - ".github/workflows/agent-stream-operations-staff.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Verify example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/agent/examples/stream-operations-staff/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Install example dependencies
        run: npm --prefix packages/agent/examples/stream-operations-staff ci

      - name: Check example formatting
        run: npm --prefix packages/agent/examples/stream-operations-staff run fmt:check

      - name: Lint example
        run: npm --prefix packages/agent/examples/stream-operations-staff run lint

      - name: Test example
        run: npm --prefix packages/agent/examples/stream-operations-staff run test

      - name: Build example
        run: npm --prefix packages/agent/examples/stream-operations-staff run build
