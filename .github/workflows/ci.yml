name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build packages in dependency order
        run: |
          npm -w @aituber-onair/chat run build
          npm -w @aituber-onair/voice run build
          npm -w @aituber-onair/core run build
          npm -w @aituber-onair/comment-intelligence run build
          npm -w @aituber-onair/agent run build

      - name: Run tests
        run: npm run test --workspaces

      - name: Install Voice React example dependencies
        run: npm --prefix packages/voice/examples/react-basic ci

      - name: Test and build Voice React example
        run: |
          npm --prefix packages/voice/examples/react-basic test
          npm --prefix packages/voice/examples/react-basic run build

      - name: Run lint
        run: npm run lint --workspaces

      - name: Check formatting
        run: npm run fmt:check --workspaces

  react-samples:
    name: React sample (${{ matrix.sample }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample:
          - packages/chat/examples/react-basic
          - packages/agent/examples/fan-mail-stage
          - packages/core/examples/react-basic
          - packages/core/examples/react-inochi2d-app
          - packages/core/examples/react-live2d-app
          - packages/core/examples/react-mesh-avatar-app
          - packages/core/examples/react-pet-app
          - packages/core/examples/react-pngtuber-app
          - packages/core/examples/react-psd-app
          - packages/core/examples/react-purupuru-app
          - packages/core/examples/react-single-image-avatar-app
          - packages/core/examples/react-vrm-app
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.sample }}/package-lock.json

      - name: Check shared sample catalog copies
        run: node scripts/check-sample-openrouter-catalog.mjs

      - name: Install workspace dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build

      - name: Install sample dependencies
        run: npm --prefix "${{ matrix.sample }}" ci

      - name: Run sample tests
        run: npm --prefix "${{ matrix.sample }}" test

      - name: Build sample
        run: npm --prefix "${{ matrix.sample }}" run build
