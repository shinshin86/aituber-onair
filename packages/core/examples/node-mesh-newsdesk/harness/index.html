<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Mesh Avatar Newsdesk Render Harness</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #stage {
        display: block;
        width: 1080px;
        height: 1920px;
      }

      /* WebGL avatar, copied into the stage every frame; sized like its on-screen frame */
      #avatar {
        position: absolute;
        left: 0;
        top: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1080" height="1920"></canvas>
    <canvas id="avatar"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
