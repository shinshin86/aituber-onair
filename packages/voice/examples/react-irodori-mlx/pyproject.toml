[project]
name = "aituber-voice-irodori-mlx-example"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-audio==0.5.3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "soundfile>=0.13,<0.14",
  "sentencepiece>=0.2,<0.3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<0.29"]

[tool.uv]
package = false
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
